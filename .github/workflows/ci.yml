name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "refactor/**"
      - "chore/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Check required files
        shell: bash
        run: |
          test -f README.md || {
            echo "README.md 파일이 없습니다."
            exit 1
          }

          test -f LICENSE || {
            echo "LICENSE 파일이 없습니다."
            exit 1
          }

          echo "필수 파일 확인 완료"
